    <body>
    
        <div class="container">

            
            <div class="row">
            <div class="col-3">

            </div>
            <div class="col-6">
                <table class="table table-striped table-hover table-dark ">
                    <caption>Tabla de productos</caption>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Temperatura</th>
                        <th>Eficancia</th>
                        <th>Incidencia</th>
                        <th>Alternativas </th>
                        <th>Precio</th>
                    </tr>


                    <tbody id="Holacam">

                    </tbody>


                </table>

                <button CLASS="btn btn-warning" onclick="Actuar()">Actualizar</button>




            </div>
            <div class="col-3">

            </div>
            </div>
        </div>










        <script>
            const url = 'http://localhost:8081/Act1'; // API de ejemplo que devuelve una lista
          
            const listat = document.getElementById('Holacam');


            fetch(url)
                    .then(respuesta => respuesta.json()) // Convierte la respuesta a una lista de objetos JS
                    .then(usuarios => {
                     
                        let contenidoTable = '';
                        // Recorremos la lista de usuarios
                        usuarios.forEach(usuario => {

                            let iusuario = usuario.m;
  
                            contenidoTable += `
 <tr>
              <td> ${iusuario.id}</td>
          <td> ${iusuario.nombre} </td>
          <td> ${iusuario.indicaciont}</td>
              <td> ${iusuario.eficancia}</td>
              <td> ${iusuario.incidencia}</td>
              <td> ${iusuario.alternativa}</td>
              <td> ${iusuario.precio}</td>
            
        </tr>
`;


                        });

                        // Inyectamos todo el bloque de una sola vez para mejor rendimiento
        
                        listat.innerHTML = contenidoTable;
                    })
                    .catch(error => console.error('Error al cargar la lista:', error));
